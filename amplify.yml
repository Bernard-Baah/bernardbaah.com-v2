version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '*.pdf'
      headers:
        - key: 'Content-Type'
          value: 'application/pdf'
        - key: 'Content-Disposition'
          value: 'inline'
