version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Dependencies require Node 22.12+ (sanitize-html, via
        # gatsby-transformer-remark). Pin to the version in .nvmrc before installing.
        - nvm install $(cat .nvmrc)
        - nvm use $(cat .nvmrc)
        - node -v
        - yarn install
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
