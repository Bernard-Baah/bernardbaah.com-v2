version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Gatsby 5 needs Node 18+. Amplify's default build image may ship an
        # older Node, so pin to the version in .nvmrc before installing.
        - nvm install $(cat .nvmrc)
        - nvm use $(cat .nvmrc)
        - node -v
        - yarn install
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
